# Minimal pytest configuration. Its ONLY purpose is to register the `slow`
# marker the suites already use, so `pytest -q` stops printing an
# PytestUnknownMarkWarning for every slow test. No other pytest behaviour is
# configured here: no addopts, no testpaths, no filterwarnings, no rootdir
# tricks -- `python3 -m pytest -q` collects and runs exactly what it did
# before this file existed.
[pytest]
markers =
    slow: real-data test that reads a committed corpus artifact (seconds, not milliseconds)
