<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FinScreen Spot-Check Review</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #ddd;
    --agree: #2e7d32;
    --disagree: #c62828;
    --unsure: #ef6c00;
    --muted: #888;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0; background: var(--bg); color: #222;
  }
  header {
    background: #1b1b2f; color: #fff; padding: 10px 16px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #progress { font-size: 13px; }
  #progress-bar-outer {
    width: 160px; height: 8px; background: #444; border-radius: 4px; overflow: hidden;
  }
  #progress-bar-inner { height: 100%; background: #4caf50; width: 0%; }
  .nav-controls { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  button {
    font-size: 13px; padding: 5px 10px; border-radius: 4px; border: 1px solid #999;
    background: #fff; cursor: pointer;
  }
  button:hover { background: #eee; }
  header button { background: #2d2d44; color: #fff; border-color: #555; }
  header button:hover { background: #3d3d5c; }
  input[type=number] { width: 60px; padding: 4px; }
  main { display: flex; gap: 0; height: calc(100vh - 52px); }
  #text-pane {
    flex: 1 1 50%; overflow-y: auto; padding: 16px 20px; background: var(--panel);
    border-right: 1px solid var(--border);
  }
  #labels-pane { flex: 1 1 50%; overflow-y: auto; padding: 16px 20px; }
  .meta-row { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .tier-badge {
    display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
    background: #333; color: #fff; margin-right: 4px;
  }
  #chunk-text {
    white-space: pre-wrap; font-size: 14.5px; line-height: 1.55; font-family: Georgia, serif;
  }
  .field-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .field-card h3 { margin: 0 0 6px 0; font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: #444; }
  .field-value { font-size: 14px; margin-bottom: 8px; }
  .na-card { opacity: .55; }
  .na-card .field-value { font-style: italic; color: var(--muted); }
  .failed-card { background: #fff3e0; border-color: #ef6c00; }
  .judgment-btns { display: flex; gap: 6px; margin-bottom: 6px; }
  .jbtn { flex: 1; }
  .jbtn.active-agree { background: var(--agree); color: #fff; border-color: var(--agree); }
  .jbtn.active-disagree { background: var(--disagree); color: #fff; border-color: var(--disagree); }
  .jbtn.active-unsure { background: var(--unsure); color: #fff; border-color: var(--unsure); }
  textarea.field-note {
    width: 100%; font-size: 12px; padding: 5px; border: 1px solid var(--border); border-radius: 4px;
    resize: vertical; min-height: 32px;
  }
  .rf-entry { border-left: 3px solid #999; padding-left: 8px; margin-bottom: 8px; }
  #example-note-box {
    width: 100%; min-height: 50px; font-size: 13px; padding: 6px; border: 1px solid var(--border);
    border-radius: 4px;
  }
  .import-export-bar {
    display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 16px; background: #eee;
    border-top: 1px solid var(--border); align-items: center;
  }
  #status-msg { font-size: 12px; color: var(--muted); }
  .discrepancy-note {
    background: #fff3e0; border: 1px solid #ef6c00; border-radius: 6px; padding: 8px 10px;
    font-size: 12.5px; margin-bottom: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>FinScreen Spot-Check<br><span style="font-weight:400;font-size:11px;">400-example owner review</span></h1>
  <div id="progress">
    <span id="progress-text">0 / 400 examples fully judged</span>
    <div id="progress-bar-outer"><div id="progress-bar-inner"></div></div>
  </div>
  <div class="nav-controls">
    <button id="btn-prev">&larr; Prev</button>
    <input type="number" id="jump-input" min="1" max="400" value="1">
    <button id="btn-jump">Go</button>
    <button id="btn-next">Next &rarr;</button>
  </div>
</header>

<main>
  <div id="text-pane">
    <div class="meta-row" id="meta-row"></div>
    <div id="chunk-text"></div>
  </div>
  <div id="labels-pane">
    <div id="labels-container"></div>
    <div class="field-card">
      <h3>Example-level note</h3>
      <textarea id="example-note-box" placeholder="Free-text note about this example as a whole (optional)"></textarea>
    </div>
  </div>
</main>

<div class="import-export-bar">
  <button id="btn-export-csv">Export CSV</button>
  <button id="btn-export-json">Export JSON</button>
  <label style="font-size:12px;">Import JSON:
    <input type="file" id="import-file" accept="application/json">
  </label>
  <button id="btn-clear" title="Clears all progress in this browser">Clear all progress</button>
  <span id="status-msg"></span>
</div>

<script>
/*__REVIEW_APP_JS__*/
</script>

<script>
const SAMPLE_DATA = /*__SAMPLE_DATA_JSON__*/;
</script>

<script>
(function () {
  "use strict";
  const R = window.FinScreenReview;
  const STORAGE_KEY = "finscreen_spotcheck_state_v1";

  const byId = {};
  SAMPLE_DATA.forEach((ex) => { byId[ex.chunk_id] = ex; });

  let state = loadState();
  let currentIndex = 0;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        // sanity: make sure it's shaped like our state, not garbage
        if (parsed && typeof parsed === "object") return parsed;
      }
    } catch (e) {
      console.warn("Failed to load saved state, starting fresh.", e);
    }
    return R.buildInitialState(SAMPLE_DATA);
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  const FIELD_LABELS = {
    sentiment: "Sentiment",
    guidance_direction: "Guidance direction",
    red_flags: "Red flags (6-category taxonomy)",
    distress_tier: "Distress tier",
  };

  function render() {
    const ex = SAMPLE_DATA[currentIndex];
    const entry = state[ex.chunk_id];

    document.getElementById("jump-input").value = currentIndex + 1;
    document.getElementById("meta-row").innerHTML =
      `<span class="tier-badge">chunk_id: ${ex.chunk_id}</span>` +
      `<span class="tier-badge">${ex.section_type}</span>` +
      `<span class="tier-badge">primary_tier: ${ex.primary_tier}</span>` +
      `<span class="tier-badge">tiers: ${ex.tiers}</span>` +
      (ex.subtier ? `<span class="tier-badge">${ex.subtier}</span>` : "") +
      `<br>word_count=${ex.word_count}`;
    document.getElementById("chunk-text").textContent = ex.text;

    const container = document.getElementById("labels-container");
    container.innerHTML = "";

    if (ex.labeling_failed) {
      const div = document.createElement("div");
      div.className = "discrepancy-note";
      div.innerHTML =
        "<strong>Labeling failed for this chunk — no labels to review.</strong><br>" +
        "parse_ok=False, api_result_type=succeeded. parse_error: " +
        (ex.parse_error || "(none recorded)") +
        "<br>The project's full_run_report.md describes this row as a model " +
        "\"refusal\"; the raw response for this row is truncated mid-string " +
        "(a token-truncation signature), not a refusal message — flagged as a " +
        "known discrepancy, not resolved here. All fields below show " +
        "'NOT AVAILABLE (labeling failed)' rather than an implied empty result.";
      container.appendChild(div);
    }

    for (const field of R.FIELD_NAMES) {
      const applicable = !!ex.applicability[field];
      const card = document.createElement("div");
      card.className = "field-card" + (applicable ? "" : " na-card") + (ex.labeling_failed ? " failed-card" : "");

      const h3 = document.createElement("h3");
      h3.textContent = FIELD_LABELS[field];
      card.appendChild(h3);

      const valueDiv = document.createElement("div");
      valueDiv.className = "field-value";

      if (!applicable) {
        valueDiv.textContent = "NOT APPLICABLE for section_type=" + ex.section_type + " (per rubric §1 applicability matrix).";
        card.appendChild(valueDiv);
        container.appendChild(card);
        continue;
      }

      if (ex.labeling_failed) {
        valueDiv.textContent = "NOT AVAILABLE (labeling failed for this chunk — see note above)";
        card.appendChild(valueDiv);
        container.appendChild(card);
        continue;
      }

      if (field === "sentiment" || field === "guidance_direction") {
        const val = ex.labels[field];
        valueDiv.textContent = val === null ? "(none returned)" : val;
      } else {
        const list = ex.labels[field];
        if (!list || list.length === 0) {
          valueDiv.textContent = "(no matches)";
        } else {
          valueDiv.innerHTML = "";
          list.forEach((entry2) => {
            const d = document.createElement("div");
            d.className = "rf-entry";
            d.textContent = entry2.category + " — " + entry2.modality;
            valueDiv.appendChild(d);
          });
        }
      }
      card.appendChild(valueDiv);

      // judgment buttons
      const btnRow = document.createElement("div");
      btnRow.className = "judgment-btns";
      ["agree", "disagree", "unsure"].forEach((j) => {
        const b = document.createElement("button");
        b.className = "jbtn";
        b.textContent = j;
        if (entry.fields[field].judgment === j) b.classList.add("active-" + j);
        b.addEventListener("click", () => {
          entry.fields[field].judgment = entry.fields[field].judgment === j ? null : j;
          saveState();
          render();
        });
        btnRow.appendChild(b);
      });
      card.appendChild(btnRow);

      const note = document.createElement("textarea");
      note.className = "field-note";
      note.placeholder = "Note about this field (optional)";
      note.value = entry.fields[field].note || "";
      note.addEventListener("input", () => {
        entry.fields[field].note = note.value;
        saveState();
      });
      card.appendChild(note);

      container.appendChild(card);
    }

    const exNoteBox = document.getElementById("example-note-box");
    exNoteBox.value = entry.example_note || "";
    exNoteBox.oninput = () => {
      entry.example_note = exNoteBox.value;
      saveState();
    };

    updateProgress();
  }

  function updateProgress() {
    const p = R.computeExampleProgress(state);
    document.getElementById("progress-text").textContent = `${p.done} / ${p.total} examples fully judged`;
    document.getElementById("progress-bar-inner").style.width = (100 * p.done / p.total) + "%";
  }

  document.getElementById("btn-prev").addEventListener("click", () => {
    currentIndex = Math.max(0, currentIndex - 1);
    render();
  });
  document.getElementById("btn-next").addEventListener("click", () => {
    currentIndex = Math.min(SAMPLE_DATA.length - 1, currentIndex + 1);
    render();
  });
  document.getElementById("btn-jump").addEventListener("click", () => {
    const v = parseInt(document.getElementById("jump-input").value, 10);
    if (!isNaN(v) && v >= 1 && v <= SAMPLE_DATA.length) {
      currentIndex = v - 1;
      render();
    }
  });

  function downloadBlob(filename, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  document.getElementById("btn-export-csv").addEventListener("click", () => {
    const csv = R.stateToCsvString(byId, state);
    downloadBlob("sample_400_review_export.csv", csv, "text/csv");
    setStatus("Exported CSV.");
  });
  document.getElementById("btn-export-json").addEventListener("click", () => {
    const json = R.stateToJsonString(state);
    downloadBlob("sample_400_review_export.json", json, "application/json");
    setStatus("Exported JSON.");
  });
  document.getElementById("import-file").addEventListener("change", (evt) => {
    const file = evt.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = R.jsonStringToState(reader.result);
        state = imported;
        saveState();
        render();
        setStatus("Imported " + file.name + " successfully.");
      } catch (e) {
        setStatus("Import failed: " + e.message);
      }
    };
    reader.readAsText(file);
  });
  document.getElementById("btn-clear").addEventListener("click", () => {
    if (confirm("Clear all progress in this browser? This cannot be undone (export first if you want a backup).")) {
      state = R.buildInitialState(SAMPLE_DATA);
      saveState();
      render();
      setStatus("All progress cleared.");
    }
  });

  function setStatus(msg) {
    document.getElementById("status-msg").textContent = msg;
  }

  render();
})();
</script>

</body>
</html>
